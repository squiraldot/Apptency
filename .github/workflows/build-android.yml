name: Build Android APK

on:
  push:
    branches:
      - main 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps 

      - name: Build Next.js Static Export
        run: npm run build

      # --- START OF JAVASCRIPT OBFUSCATION ---
      - name: Obfuscate Web Production Assets
        run: |
          # Obfuscates all .js assets inside the Next.js static build out folder.
          # Applies Base64 encoding.
          npx javascript-obfuscator ./out --output ./out --compact true --self-defending true --string-array true --string-array-encoding 'base64' --string-array-threshold 0.75
      # --- END OF JAVASCRIPT OBFUSCATION ---

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize & Sync Capacitor Native Android Wrapper
        run: |
          # FIXED: Locked Capacitor major versions to v6 with '--legacy-peer-deps' to eliminate native dependency mismatches
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 --legacy-peer-deps
          
          # Generate the Android folder if it doesn't already exist in the project
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Sync the obfuscated "out" web folder with the Android native folder
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apptency-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
